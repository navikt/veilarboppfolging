name: build.yml
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK:
        required: true
      GRADLE_ENCRYPTION_KEY:
        required: true
    outputs:
      image:
        description: "Image name pushed to GAR"
        value: ${{ jobs.test-build-and-push.outputs.image }}

jobs:
  test-build-and-push:
    name: Test, build and push
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Oslo'
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: "9.1.0"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build and test
        run: ./gradlew build

      - name: Generate and output SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: 'build/libs'
          format: 'cyclonedx-json'
          artifact-name: 'bom.json'
          output-file: 'build/reports/bom.json'
          upload-artifact: 'true'

      - name: Build and push Docker image
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1
        id: docker-build-push
        with:
          team: poao # This is not app namespace but team which is admin in github
          byosbom: 'build/reports/bom.json'
