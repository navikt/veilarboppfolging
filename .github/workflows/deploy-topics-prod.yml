name: Deploy oppfolgingshendelse topic to prod
on:
  push:
    branches:
      - main
    paths:
      - "kafka-topics/privat-oppfolgingshendelse-prod.yaml"
      - "kafka-topics/siste-oppfolgingsperiode-v2-prod.yaml"
      - "kafka-topics/siste-oppfolgingsperiode-v3-prod.yaml"
      - "kafka-topics/start-oppfolging-prod.yaml"
  workflow_dispatch:

jobs:
  deploy-topics-dev:
    name: Deploy oppfolgingshendelse topic to prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy kafka topic privat-oppfolgingshendelse-prod
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891
        env:
          CLUSTER: prod-gcp
          RESOURCE: kafka-topics/privat-oppfolgingshendelse-prod.yaml
          PRINT_PAYLOAD: true
      - name: Deploy kafka topic siste-oppfolgingsperiode-v2-prod
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891
        env:
          CLUSTER: prod-gcp
          RESOURCE: kafka-topics/siste-oppfolgingsperiode-v2-prod.yaml
          PRINT_PAYLOAD: true
      - name: Deploy kafka topic siste-oppfolgingsperiode-v3-prod
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891
        env:
          CLUSTER: prod-gcp
          RESOURCE: kafka-topics/siste-oppfolgingsperiode-v3-prod.yaml
          PRINT_PAYLOAD: true
      - name: Deploy kafka topic start-oppfolging-prod
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891
        env:
          CLUSTER: prod-gcp
          RESOURCE: kafka-topics/start-oppfolging-prod.yaml
          PRINT_PAYLOAD: true