query testUtmeldingskandidater($fnr: String!) {
    utmeldingskandidat(fnr: $fnr) {
        aktivForlengelse {
            utfortAvType
            utfortAv
            hendelseTidspunkt
            forlengetTil
        }
        utmeldingskandidatHendelser {
            utfortAvType
            utfortAv
            hendelseTidspunkt
            type
            forlengetTil
        }
        tag
    }
}